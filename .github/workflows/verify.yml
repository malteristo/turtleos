name: verify

# A clean-environment run of the same gate the pre-push hook runs.
#
# The local gate and this one are not redundant. Locally the dependencies are
# already installed and the venv already works — and on 2026-08-14 that venv had
# 21 console scripts whose interpreter path no longer existed, which left four
# content fetchers dead on the live host for months while every local check
# passed. Installing from `requirements.txt` into an empty machine is the only
# check that sees that class of failure.
#
# Two Python versions on purpose: 3.14 is what the live host runs, 3.11 is what
# the operator's development machine runs. A failure on only one of them is a
# real finding rather than noise.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report the environment
        run: |
          python -V
          pip freeze

      - name: Unit gate
        run: ./scripts/spirit_verify.sh

  # The repo carries several guards that read the tree rather than run behaviour
  # (transport boundary, offer registry, acceptance catalogue, quality measures).
  # They are part of the unit suite above; this job exists so the generated
  # quality numbers are visible in a run log without anyone opening a terminal.
  measures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Structural measures
        run: python3 scripts/quality_baseline.py
