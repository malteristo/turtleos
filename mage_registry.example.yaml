# Example registry for turtleOS multi-practitioner routing.
# Copy to mage_registry.yaml and replace placeholders with your Discord IDs,
# channel IDs, and local practice paths. Keep the real file untracked.
#
# Native topology (2026-06-29): practice_dir and runtime_dir colocate at
# ~/workshops/<name>/. No workshop_root — Magic framework stays on Forge only.

# Attunement profile (TURTLE_SPEC §4):
#   native  — vanilla platform law (only supported profile)
# attunement: native
#
# Member relations (docs/design/relations-and-membership.md) — circles, not a
# trust ladder. `relation:` governs who a member may reach; missing or unknown
# values are treated as `guest`, so nobody joins the family by omission.
#   household — whose ordinary week the shared river is about
#   kin       — extended family, either side; reaches household + kin
#   guest     — friends, hosted practitioners; reaches an administrator only
# `admin: true` is the orthogonal capability (host tools, invites, spaces). It
# is held alongside a relation — the operator is a member with special rights.
# `primary: true` / `default_mage` still grant admin for existing registries,
# but they mean "whose practice root is the default"; a second administrator
# needs `admin`, not a second primary.
#
# Channel types:
#   river         — operator/practitioner main practice surface (acts in parent, dialogue in eddies)
#   hosted-river  — sovereign practitioner's river on operator's server (same harness as river)
#   unclaimed-river — private claim room; becomes hosted-river on river key drop
#   shared        — legacy multi-practitioner dialogue (migrate to shared-river)
#   shared-river  — multi-member space river (acts in parent, shared eddies) — see docs/chapters/design-family-shared-river.md
#   craft         — builder vocation surface (design chapter: docs/chapters/design-craft-channel.md)
#   health        — living picture (Turtle owns the parent; not a river). Bind a
#                   spaces.* entry with memory: isolated so personal rivers
#                   do not absorb it. default_context: health.
#
# Two-bot native mode (TURTLE_SPEC §5.8): set RIVER_BOT_TOKEN in .env and run river_bot.py
# (com.turtle.river). River bot posts acts in the main channel; Turtle bot speaks in eddies.

mages:
  default:
    discord_id: "YOUR_DISCORD_USER_ID"
    address: "Your Name"
    practice_dir: ~/workshops/default
    runtime_dir: ~/workshops/default
    type: mage
    primary: true
    admin: true
    relation: household

  # Coach studio — a house-bot identity, not a member. Doctor stays clean.
  # spirit:
  #   discord_id: "SPIRIT_BOT_USER_ID"
  #   address: "Spirit"
  #   practice_dir: ~/workshops/spirit
  #   runtime_dir: ~/workshops/spirit
  #   type: practitioner
  #   relation: guest
  #   roster: false

# Do not pre-create spaces here. A spaces.family stub with no Discord channel
# makes `!admin space create family` say the space already exists and create
# nothing. Provision with:
#   !admin space create family --members @you @them --context family --policy members_only
# See docs/chapters/design-admin-space-provisioning.md.

channels:
  "YOUR_DIALOGUE_CHANNEL_ID":
    mage: default
    type: river
    primitive: private
    default_context: null
    discord_category: Rivers
    description: Private practice surface

  # "YOUR_SPIRIT_STUDIO_CHANNEL_ID":
  #   mage: spirit
  #   type: river
  #   primitive: private
  #   default_context: null
  #   discord_category: Rivers
  #   description: Coach studio — Spirit sits as a practitioner; not a roster member

  "YOUR_CRAFT_CHANNEL_ID":
    mage: default
    type: craft
    primitive: craft
    attunement: craft
    default_context: craft
    discord_category: Craft
    description: Craft Turtle builder surface — learning intake for harness/product friction

  "YOUR_HEALTH_CHANNEL_ID":
    mage: health
    type: health
    primitive: health
    attunement: native
    default_context: health
    discord_category: Health
    description: Living picture — best current explanation

# spaces:
#   health:
#     practice_dir: ~/workshops/health
#     runtime_dir: ~/workshops/health
#     members: [default, partner]
#     share_policy: members_only
#     memory: isolated

default_mage: default
