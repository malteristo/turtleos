# public_surface.conf — what MAY become public when turtleOS publishes.
#
# The private origin (github.com/malteristo/turtleos, Mini pulls it) keeps
# history. The public remote receives a subset with its own lineage. This file
# is the single allowlist. Grammar matches magic's:
#
#   DIR  <path>    every file beneath this directory may be public
#   FILE <path>    exactly this file may be public
#   DENY <pat>     not public, even inside an allowed DIR
#
# Precedence: FILE > DENY > DIR
#
# DENY matching: bare token = basename at any depth; trailing / = directory
# at any depth; * = glob; otherwise exact path from repo root.
#
# Do not write a real person's name into this file. A held-exception filename
# that still carries one is renamed before it is denied here, or it stays off
# the surface via an operator-local list — never via a name in tracked source.

# ─── Product ─────────────────────────────────────────────────────
DIR  docs
DIR  tests
DIR  template
DIR  scripts
DIR  runtime
DIR  core
DIR  skills
DIR  procedures
DIR  hooks
DIR  .github
DIR  deploy
DIR  static

FILE README.md
FILE TURTLE_SPEC.md
FILE ARCHITECTURE.md
FILE AGENTS.md
FILE CLAUDE.md
FILE PRACTICE.md
FILE LICENSE
FILE requirements.txt
FILE .gitignore
FILE .env.template
FILE mage_registry.example.yaml
FILE restart.sh

# Root shell modules — the engine. A FILE each would be a second inventory;
# the publish script copies every tracked *.py / *.md / *.sh at repo root.
# Listed as DIR of "." is not supported; the list script treats root files
# that are not denied as public when they match ROOT_SHIP.

# ─── Denied: one deployment, not the product ─────────────────────
DENY docs/live-runtime.md
DENY docs/learnings.md

# ─── Denied: research queue and retired identity ─────────────────
DENY autoresearch/
DENY identity/

# ─── Denied: runtime noise ───────────────────────────────────────
DENY test-runs/
DENY .DS_Store
DENY __pycache__/
DENY *.lock
DENY archive/
